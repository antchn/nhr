<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Ninh Hiệp Runners</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .login-page {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(13, 15, 18, 0.9) 0%, rgba(13, 15, 18, 0.95) 100%), url('assets/nhr_hero.jfif') no-repeat center center;
            background-size: cover;
        }

        .login-container {
            background: rgba(23, 26, 31, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .login-container h2 {
            margin-bottom: 24px;
            font-size: 2rem;
            color: var(--color-gold);
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: var(--color-text-muted);
        }

        .form-group input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 14px 20px;
            border-radius: 12px;
            font-family: var(--font-body);
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
        }

        .form-group input:focus {
            border-color: var(--color-gold);
            box-shadow: 0 0 10px var(--color-gold-glow);
            background: rgba(255, 255, 255, 0.1);
        }

        .login-btn {
            width: 100%;
            margin-top: 10px;
            padding: 14px;
            font-size: 1.1rem;
        }

        .back-link {
            display: inline-block;
            margin-top: 24px;
            font-size: 0.9rem;
            color: var(--color-text-muted);
            text-decoration: none;
        }

        .back-link:hover {
            color: var(--color-gold);
            transform: translateX(-2px);
        }

        /* Responsive tweaks */
        @media (max-width: 500px) {
            .login-container {
                padding: 30px 20px;
                margin: 0 20px;
            }
        }

        /* Modal Styles */
        .modal {
            visibility: hidden;
            opacity: 0;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: visibility 0.3s, opacity 0.3s ease;
        }

        .modal.active {
            visibility: visible;
            opacity: 1;
        }

        .modal-content {
            background: rgba(23, 26, 31, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            position: relative;
            transform: translateY(-20px);
            transition: transform 0.3s ease;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal.active .modal-content {
            transform: translateY(0);
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 28px;
            color: var(--color-text-muted);
            cursor: pointer;
            transition: color 0.3s;
            line-height: 1;
        }

        .close-btn:hover {
            color: var(--color-gold);
        }

        .modal-content h2 {
            margin-bottom: 24px;
            font-size: 1.8rem;
            color: var(--color-gold);
            text-transform: uppercase;
            text-align: center;
        }

        .checkbox-group {
            margin-top: 5px;
            margin-bottom: 20px;
            display: flex;
            align-items: flex-start;
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
            font-size: 0.9rem;
            color: var(--color-text-muted);
            cursor: pointer;
            margin-bottom: 0;
            text-align: left;
            line-height: 1.4;
        }

        .checkbox-group input {
            width: auto;
            margin-right: 10px;
            cursor: pointer;
            accent-color: var(--color-gold);
            transform: scale(1.2);
            /* Firefox-specific */
            margin-top: 2px;
        }

        /* Custom scrollbar for modal */
        .modal-content::-webkit-scrollbar {
            width: 6px;
        }

        .modal-content::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
        }

        .modal-content::-webkit-scrollbar-thumb {
            background: rgba(255, 215, 0, 0.5);
            border-radius: 4px;
        }
        
        .modal-content::-webkit-scrollbar-thumb:hover {
            background: var(--color-gold);
        }
    </style>
</head>

<body>
    <div class="login-page">
        <div class="login-container">
            <h2>Đăng nhập</h2>
            <form action="#">
                <div class="form-group">
                    <label for="email">Tài khoản (Email)</label>
                    <input type="email" id="email" placeholder="Nhập email của bạn" required>
                </div>
                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <input type="password" id="password" placeholder="Nhập mật khẩu" required>
                </div>
                <button type="submit" class="btn btn-gold login-btn">Hoàn tất</button>
                <a href="#" id="openRegisterModal" class="btn btn-outline-gold login-btn" style="margin-top: 16px; display: block; box-sizing: border-box;">Đăng ký tài khoản</a>
                <a href="index.html" class="back-link">&leftarrow; Quay lại trang chủ</a>
            </form>
        </div>
    </div>

    <!-- Registration Modal -->
    <div id="registerModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeRegisterModal">&times;</span>
            <h2>Đăng ký tài khoản</h2>
            <form id="registerForm">
                <div class="form-group">
                    <label for="reg-fullname">Họ và tên</label>
                    <input type="text" id="reg-fullname" placeholder="Nhập họ và tên" required>
                </div>
                <div class="form-group">
                    <label for="reg-email">Email</label>
                    <input type="email" id="reg-email" placeholder="Nhập email" required>
                </div>
                <div class="form-group">
                    <label for="reg-phone">Số điện thoại</label>
                    <input type="tel" id="reg-phone" placeholder="Nhập số điện thoại" required>
                </div>
                <div class="form-group">
                    <label for="reg-password">Mật khẩu</label>
                    <input type="password" id="reg-password" placeholder="Nhập mật khẩu" required>
                </div>
                <div class="form-group">
                    <label for="reg-confirm-password">Nhập lại mật khẩu</label>
                    <input type="password" id="reg-confirm-password" placeholder="Nhập lại mật khẩu" required>
                </div>
                <div class="checkbox-group">
                    <label>
                        <input type="checkbox" id="reg-terms" required> 
                        Tôi đồng ý với <a href="#" style="color: var(--color-gold); text-decoration: none; margin: 0 4px;">Điều khoản</a> và <a href="#" style="color: var(--color-gold); text-decoration: none; margin-left: 4px;">Chính sách</a>
                    </label>
                </div>
                <button type="submit" class="btn btn-gold login-btn">Đăng ký</button>
            </form>
        </div>
    </div>

    <script>
        // Login Logic
        const loginForm = document.querySelector('.login-container form');
        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if (email === 'admin@ninhhiep.com' && password === 'admin123') {
                localStorage.setItem('loggedInUser', 'Admin Ninh Hiệp');
                alert('Đăng nhập thành công! Chào mừng thư ký Ban Quản Trị Ninh Hiệp Runners.');
                window.location.href = 'index.html';
            } else {
                alert('Thông tin tài khoản hoặc mật khẩu không chính xác. Vui lòng thử lại!');
            }
        });

        // Registration Modal Logic
        const registerModal = document.getElementById('registerModal');
        const openRegisterModalBtn = document.getElementById('openRegisterModal');
        const closeRegisterModalBtn = document.getElementById('closeRegisterModal');
        const registerForm = document.getElementById('registerForm');

        // Open Modal
        openRegisterModalBtn.addEventListener('click', function(e) {
            e.preventDefault();
            registerModal.classList.add('active');
        });

        // Close Modal
        function closeRegisterModal() {
            registerModal.classList.remove('active');
        }

        closeRegisterModalBtn.addEventListener('click', closeRegisterModal);

        // Close when clicking outside
        window.addEventListener('click', function(e) {
            if (e.target === registerModal) {
                closeRegisterModal();
            }
        });

        // Handle Registration Form Submit
        registerForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const password = document.getElementById('reg-password').value;
            const confirmPassword = document.getElementById('reg-confirm-password').value;

            if (password !== confirmPassword) {
                alert('Mật khẩu không khớp. Vui lòng kiểm tra lại!');
                return;
            }

            alert('Đăng ký tài khoản thành công! Vui lòng chờ phê duyệt từ Ban quản trị.');
            closeRegisterModal();
            registerForm.reset();
        });
    </script>
</body>

</html>
